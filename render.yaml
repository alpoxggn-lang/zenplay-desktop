services:
  - type: web
    name: zenplay-web-online
    runtime: docker
    plan: free
    branch: master
    autoDeployTrigger: commit
    dockerContext: .
    dockerfilePath: ./docker/Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: ZENPLAY_XTREAM_URL
        sync: false
      - key: ZENPLAY_DISABLE_XTREAM_GET
        value: "1"
      - key: ZENPLAY_MEDIA_SOURCE_SECRET
        generateValue: true
      - key: ZENPLAY_TRUST_PROXY_HOPS
        value: "1"
